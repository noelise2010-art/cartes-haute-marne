\f0\fs24 \cf0 # Configuration g\'e9n\'e9rale\
backend:\
  name: git-gateway\
  branch: main\
\
# Dossier o\'f9 seront stock\'e9es les images upload\'e9es\
media_folder: "images/uploads"\
public_folder: "/images/uploads"\
\
# Collection principale : les villages\
collections:\
  - name: "villages"\
    label: "Villages"\
    folder: "data/villages"\
    create: true\
    slug: "\{\{slug\}\}"\
    fields:\
      - \{ name: "name", label: "Nom du village", widget: "string" \}\
      - \{ name: "cards", label: "Cartes postales", widget: "list", summary: "\{\{fields.legend\}\}" \}\
      - name: "cards"\
        label: "Cartes postales"\
        widget: "list"\
        summary: "\{\{fields.legend\}\}"\
        fields:\
          - \{ name: "image", label: "Image", widget: "image" \}\
          - \{ name: "legend", label: "L\'e9gende", widget: "string" \}}